[package]
name = "rfmon"
version = "0.1.1"
edition = "2024"
# The zbus tree's floor, not this crate's; the code itself needs only 1.85.
rust-version = "1.87"
description = "Linux 802.11 monitor mode library and CLI without killing NetworkManager or wpa_supplicant"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["wifi", "monitor-mode", "nl80211", "wireless", "80211"]
categories = ["network-programming", "os::linux-apis", "command-line-utilities"]
exclude = ["STYLE_GUIDE_RS.MD", ".github", ".gitignore"]
repository = "https://github.com/tea-kettles/rfmon"

[dependencies]
futures = "0.3.33"
thiserror = "2.0.19"
# Deliberately minimal: `macros` and `rt-multi-thread` come from the `cli`
# feature and dev-dependencies, so library consumers never pull them.
tokio = { version = "1.53.1", default-features = false, features = ["rt", "net", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }

# Do not move these into [dependencies]. They wrap netlink and D-Bus and do not
# compile off Linux, and cargo builds dependencies before the crate naming them,
# so ungated they fail first and the `compile_error!` in lib.rs explaining that
# Linux is the only target is never reached.
[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.21.0"
wl-nl80211 = { version = "0.4.0", default-features = false, features = ["tokio_socket"] }
zbus = { version = "5.18.0", default-features = false, features = ["tokio"], optional = true }

[dev-dependencies]
# `test-util` drives the virtual clock the timeout tests advance, so none of
# them spends real seconds waiting on a deadline.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = ["dbus"]
# NetworkManager / wpa_supplicant coordination. Off leaves the raw nl80211 switch
# and drops the zbus subtree.
dbus = ["dep:zbus"]
cli = ["dep:tracing-subscriber", "tokio/rt-multi-thread", "tokio/macros"]

[[bin]]
name = "rfmon"
path = "src/bin/rfmon.rs"
required-features = ["cli"]
